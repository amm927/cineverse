version: '3.8'

networks:
  cineverse-net:
    driver: bridge

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Microservicio de Scraping (BeautifulSoup + TMDB + NLP TextBlob)
  # Solo accesible dentro de la red interna de Docker (no expone puerto al host)
  # ──────────────────────────────────────────────────────────────────────────
  backend-scraper:
    build: ./backend-scraper
    container_name: cineverse-scraper-service
    expose:
      - "8001"
    volumes:
      - ./backend-scraper:/app
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN}
    networks:
      - cineverse-net
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────────────
  # Servicio de Redis para almacenamiento en caché de alto rendimiento
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: cineverse-redis
    networks:
      - cineverse-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # API Gateway principal (FastAPI + SQLAlchemy + WebSockets)
  # Consume el scraper service por la red interna: http://backend-scraper:8001
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: cineverse-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN}
      - SCRAPER_SERVICE_URL=http://backend-scraper:8001
      - REDIS_URL=redis://redis:6379/0
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    depends_on:
      backend-scraper:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cineverse-net
    restart: always

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend React + Vite
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cineverse-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=https://xhzq100nllyp.share.zrok.io
      - VITE_GOOGLE_CLIENT_ID=${OAuth_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - cineverse-net
    restart: always
